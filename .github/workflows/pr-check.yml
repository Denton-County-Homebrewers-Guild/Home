name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm ci

      - name: Auto-move raw image uploads
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"
          node scripts/auto-move-uploaded-images.mjs "origin/$BASE_REF"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/images originals/images
            git commit -m "Auto-move raw image upload(s) to originals/"
            git push origin HEAD:"$HEAD_REF"
          else
            echo "No changes to commit."
          fi

      - name: Validate carousel-images.json
        run: node -e "JSON.parse(require('fs').readFileSync('src/config/carousel-images.json', 'utf8')); console.log('carousel-images.json is valid JSON')"

      - name: Optimize carousel images
        run: npm run optimize-images

      - name: Build main site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install docs dependencies
        run: npm ci
        working-directory: ./docs

      - name: Build docs
        run: npm run build
        working-directory: ./docs
